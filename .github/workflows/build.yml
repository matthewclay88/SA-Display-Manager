name: Build SA Display Manager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SA-Display-Manager src/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SA-Display-Manager
          path: dist/SA-Display-Manager.exe
